let mtCurrentProduct = 'G112-经理人玩法·关卡通关率分析';
let mtActiveTreeId = '';
let mtActiveTab = 'tab-mt-m';
let mtMetricPage = 1;
let mtDimPage = 1;
let mtPageSize = 50;
let mtFilterKeyword = '';
let mtFilterOutTable = '';
let mtFilterSrcTable = '';

function renderMetricTreePage(productName, treeId) {
  if(productName) mtCurrentProduct = productName;

  // 使用全项目统一数据源
  const data = getProjectWideData();
  const tree = getProjectWideTree();
  if(!data || !tree.length){ document.getElementById('page-metric-tree').innerHTML='<div style="padding:40px;text-align:center;color:#bfbfbf">暂无数据</div>'; return; }

  // 找出数据对应的主要产品名（用于 cat 映射）
  const mainProduct = Object.keys(AC_METRICS_DATA).find(k=>AC_METRICS_DATA[k]&&AC_METRICS_DATA[k].metrics.length>0)||mtCurrentProduct;

  // ── 在树末尾追加「未分类」节点 ──
  // 计算未分类的数量：没有映射到任何分类的指标+维度
  function countUncategorized() {
    const mainProd = mainProduct;
    const allMetrics = data.metrics.filter(m => m.type !== '维度');
    const allDims = data.dims;
    let cnt = 0;
    allMetrics.forEach(m => { const c = getAcCatForItem(mainProd, m.n, 'metric'); if(!c) cnt++; });
    allDims.forEach(d => { const c = getAcCatForItem(mainProd, d.n, 'dim'); if(!c) cnt++; });
    return cnt;
  }
  const UNCAL_CNT = countUncategorized();
  // 如果已有「未分类」节点则不重复添加
  if (!tree.some(n => n.id === 'uncategorized')) {
    tree.push({
      id: 'uncategorized',
      n: '未分类',
      d: '尚未归类到任何分类的指标与维度',
      kids: [],
      _cnt: UNCAL_CNT,
    });
  }

  const PLUS_IC='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  const EDIT_IC='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4z"/></svg>';
  const DEL_IC='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>';

  function catItemCount(catId, type){
    const list=type==='metric'?data.metrics.filter(m=>m.type!=='维度'):type==='dim'?data.dims:data.tables;
    return list.filter(x=>getAcCatForItem(mainProduct,x.n,type)===catId).length;
  }
  function catTotal(catId){ return catItemCount(catId,'metric')+catItemCount(catId,'dim')+catItemCount(catId,'table'); }
  // 初始化 kids + 计数
  function initKidsMt(nodes){nodes.forEach(n=>{if(!n.kids)n.kids=[];initKidsMt(n.kids);acCatCountForNode(n,data,mainProduct);});}
  initKidsMt(tree);
  // 重新修正「未分类」节点计数（acCatCountForNode 无法匹配 'uncategorized' id）
  const uncatNode = tree.find(n => n.id === 'uncategorized');
  if(uncatNode) uncatNode._cnt = UNCAL_CNT;

  // ── 更新 activeTreeId & 分类切换时重置页码 ──
  const _prevTreeId = mtActiveTreeId;
  if(treeId !== undefined) mtActiveTreeId = treeId;
  else if(!productName) mtActiveTreeId = '';
  if(mtActiveTreeId !== _prevTreeId){ mtMetricPage = 1; mtDimPage = 1; }

  const totalM=data.metrics.filter(m=>m.type!=='维度').length;
  const allActive=mtActiveTreeId===''?' active':'';
  const clickFnMt = (id)=>`renderMetricTreePage('${escAttr(mtCurrentProduct)}','${id}')`;
  const treeNodesHtml=tree.map(node=>renderAcTreeNode(node,0,mtActiveTreeId,clickFnMt,'mt')).join('');

  const filterFn=(item,type)=>{
    if(!mtActiveTreeId) return true;
    // 未分类特殊处理：只显示无分类映射的项
    if(mtActiveTreeId === 'uncategorized') {
      const itemCat = getAcCatForItem(mainProduct,item.n,type);
      return !itemCat;
    }
    const treeRef = AC_TREE_DATA[mainProduct]||[];
    const itemCat = getAcCatForItem(mainProduct,item.n,type);
    return isCatMatch(itemCat, mtActiveTreeId, treeRef);
  };
  // ── 关键字 + 表名过滤 ──
  const mtKeywordFn = (item) => {
    if(!mtFilterKeyword) return true;
    const kw = mtFilterKeyword.toLowerCase();
    return (item.n||'').toLowerCase().includes(kw)||(item.cn||'').toLowerCase().includes(kw)||(item.desc||'').toLowerCase().includes(kw);
  };
  const mtTableFn = (item) => {
    if(mtFilterOutTable && (item.outTable||'').trim() !== mtFilterOutTable) return false;
    if(mtFilterSrcTable && (item.srcTable||'').trim() !== mtFilterSrcTable) return false;
    return true;
  };
  const hasFilter=!!(mtFilterKeyword||mtFilterOutTable||mtFilterSrcTable);
  const filteredMetrics=data.metrics.filter(m=>m.type!=='维度'&&(hasFilter||filterFn(m,'metric'))&&mtKeywordFn(m)&&mtTableFn(m));
  const filteredDims=data.dims.filter(d=>(hasFilter||filterFn(d,'dim'))&&mtKeywordFn(d)&&mtTableFn(d));

  // 分页切片
  const mtMetricTotalPages = Math.max(1, Math.ceil(filteredMetrics.length / mtPageSize));
  const mtDimTotalPages    = Math.max(1, Math.ceil(filteredDims.length / mtPageSize));
  if(mtMetricPage > mtMetricTotalPages) mtMetricPage = mtMetricTotalPages;
  if(mtDimPage    > mtDimTotalPages)    mtDimPage    = mtDimTotalPages;
  const mtPagedMetrics = filteredMetrics.slice((mtMetricPage-1)*mtPageSize, mtMetricPage*mtPageSize);
  const mtPagedDims    = filteredDims.slice((mtDimPage-1)*mtPageSize, mtDimPage*mtPageSize);

  // 找到当前激活分类（递归）
  function findCatInTree(nodes,id){for(const n of nodes){if(n.id===id)return n;const r=findCatInTree(n.kids||[],id);if(r)return r;}return null;}
  const activeCat=mtActiveTreeId?findCatInTree(tree,mtActiveTreeId):null;
  const catBannerHtml=activeCat?`
    <div class="ac-cat-banner">
      <div class="ac-cat-actions">
        <button class="btn btn-primary btn-sm" onclick="openAcImportModal('mt')">${PLUS_IC} 添加</button>
      </div>
      <div style="font-size:11px;color:#8c8c8c;margin-bottom:4px">全部 / <span style="color:#1890ff">${activeCat.n}</span></div>
      <div class="ac-cat-name">${activeCat.n}</div>
      <div class="ac-cat-desc">${escHtml(activeCat.d)}</div>
    </div>`:
    `<div class="ac-cat-banner">
      <div class="ac-cat-actions">
        <button class="btn btn-primary btn-sm" onclick="openAcImportModal('mt')">${PLUS_IC} 添加</button>
      </div>
      <div class="ac-cat-name">全部</div>
      <div class="ac-cat-desc">查看全部指标与维度，不限分类</div>

// ── P7 分页辅助 ──
function buildMtPagination(curPage, totalPages, totalItems, goFnName) {
  if(totalPages <= 1) return '';
  const pages = [];
  const maxVisible = 5;
  let start = Math.max(1, curPage - Math.floor(maxVisible/2));
  let end   = Math.min(totalPages, start + maxVisible - 1);
  if(end - start + 1 < maxVisible) start = Math.max(1, end - maxVisible + 1);
  for(let i = start; i <= end; i++) pages.push(i);
  const SIZE_OPTS = [50, 100, 200];
  return `<div class="pagination" style="padding:8px 16px;border-top:1px solid #f0f0f0;flex-shrink:0;justify-content:flex-end;gap:4px">
    <span style="font-size:12px;color:#8c8c8c;margin-right:4px">共 ${totalItems} 条</span>
    <button class="page-btn" onclick="${goFnName}(1)" ${curPage<=1?'disabled':''} style="min-width:28px;padding:3px 8px">«</button>
    <button class="page-btn" onclick="${goFnName}(${curPage-1})" ${curPage<=1?'disabled':''} style="min-width:28px;padding:3px 8px">‹</button>
    ${pages.map(p=>`<button class="page-btn${p===curPage?' active':''}" onclick="${goFnName}(${p})" style="min-width:28px;padding:3px 8px">${p}</button>`).join('')}
    <button class="page-btn" onclick="${goFnName}(${curPage+1})" ${curPage>=totalPages?'disabled':''} style="min-width:28px;padding:3px 8px">›</button>
    <button class="page-btn" onclick="${goFnName}(${totalPages})" ${curPage>=totalPages?'disabled':''} style="min-width:28px;padding:3px 8px">»</button>
    <div class="ant-sel-wrap" style="margin-left:10px;min-width:auto">
      <select onchange="setMtPageSize(Number(this.value))" style="height:28px;font-size:12px;padding:0 22px 0 7px;border-radius:5px;width:auto">
        ${SIZE_OPTS.map(s=>`<option value="${s}" ${mtPageSize===s?'selected':''}>${s} 条/页</option>`).join('')}
      </select>
    </div>
  </div>`;
}
function setMtPageSize(n) { mtPageSize = n; mtMetricPage = 1; mtDimPage = 1; renderMetricTreePage(); }
function goToMtMetricPage(n) { mtMetricPage = n; renderMetricTreePage(); }
function goToMtDimPage(n)    { mtDimPage    = n; renderMetricTreePage(); }

function mtSetTab(el,tabId){
  document.querySelectorAll('#page-metric-tree .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('#page-metric-tree .tabpane').forEach(p=>p.style.display='none');
  document.getElementById(tabId).style.display='flex';
  mtActiveTab=tabId;
}
function mtTreeSearch(kw){
  const k=(kw||'').trim().toLowerCase();
  // 收集所有树节点 id -> node 的映射
  const nodeMap={};
  function collectNodes(nodes){nodes.forEach(n=>{nodeMap[n.id]=n;collectNodes(n.kids||[]);});}
  collectNodes(getProjectWideTree());
  document.querySelectorAll('#mtTreeBody [id^="aim-node-"], #mtTreeBody .ac-tnode').forEach(el=>{
    if(el.id==='aim-all-node'){el.style.display='';return;}
    const nid=el.getAttribute('id')?.replace('aim-node-','');
    const node=nid?nodeMap[nid]:null;
    if(!node){el.style.display='';return;}
    const match=!k||node.n.toLowerCase().includes(k)||(node.d||'').toLowerCase().includes(k);
    el.style.display=match?'':'none';
    // 若有子节点包装，也展示
    const kidsWrap=document.getElementById('kids-'+nid);
    if(kidsWrap&&match)kidsWrap.style.display='';
  });
}

function openBloodLineage(name, type, context){
  const product = context==='mt' ? mtCurrentProduct : acCurrentProduct;
  const rawData = AC_METRICS_DATA[product]||{metrics:[],dims:[]};
  const item = type==='metric'
    ? rawData.metrics.find(x=>x.n===name)
    : rawData.dims.find(x=>x.n===name);
  if(!item) return;

  // ── 血缘 Mock 数据（按指标名预设）──
  const curNode = {id:'cur',lbl:name,sub:item.cn||(type==='metric'?'指标':'维度'),t:'cur'};
  const LMOCK = {
    retention_d1:{
      cols:[[{id:'j0',lbl:'DAU 汇总作业',sub:'数据作业',t:'job'},{id:'j1',lbl:'新增用户汇总作业',sub:'数据作业',t:'job'}],

             [curNode],
             [{id:'d0',lbl:'留存分析看板',sub:'数据看板',t:'board'},{id:'d1',lbl:'新用户留存分析',sub:'分析案例',t:'case'}]],
      edges:[['j0','u0'],['j1','u1'],['u0','cur'],['u1','cur'],['cur','d0'],['cur','d1']],
    },
    retention_d7:{
      cols:[[{id:'j0',lbl:'DAU 汇总作业',sub:'数据作业',t:'job'},{id:'j1',lbl:'新增用户汇总作业',sub:'数据作业',t:'job'}],
             [{id:'u0',lbl:'日活跃用户数',sub:'指标',t:'up'},{id:'u1',lbl:'新增用户数',sub:'指标',t:'up'}],
             [curNode],
             [{id:'d0',lbl:'7日留存看板',sub:'数据看板',t:'board'},{id:'d1',lbl:'用户留存趋势',sub:'分析案例',t:'case'}]],
      edges:[['j0','u0'],['j1','u1'],['u0','cur'],['u1','cur'],['cur','d0'],['cur','d1']],
    },
    dau:{
      cols:[[{id:'j0',lbl:'用户登录日志作业',sub:'数据作业',t:'job'}],
             [{id:'u0',lbl:'ods_user_login',sub:'数据表',t:'up'}],
             [curNode],
             [{id:'d0',lbl:'用户活跃看板',sub:'数据看板',t:'board'},{id:'d1',lbl:'日活分析案例',sub:'分析案例',t:'case'}]],
      edges:[['j0','u0'],['u0','cur'],['cur','d0'],['cur','d1']],
    },
    mau:{
      cols:[[{id:'j0',lbl:'月活汇总作业',sub:'数据作业',t:'job'}],
             [{id:'u0',lbl:'ods_user_login',sub:'数据表',t:'up'}],
             [curNode],
             [{id:'d0',lbl:'月活趋势看板',sub:'数据看板',t:'board'},{id:'d1',lbl:'用户月活分析',sub:'分析案例',t:'case'}]],
      edges:[['j0','u0'],['u0','cur'],['cur','d0'],['cur','d1']],
    },
    new_user_cnt:{
      cols:[[{id:'j0',lbl:'用户注册作业',sub:'数据作业',t:'job'}],
             [{id:'u0',lbl:'ods_user_action',sub:'数据表',t:'up'}],
             [curNode],
             [{id:'d0',lbl:'新用户增长看板',sub:'数据看板',t:'board'},{id:'d1',lbl:'用户增长分析',sub:'分析案例',t:'case'}]],
      edges:[['j0','u0'],['u0','cur'],['cur','d0'],['cur','d1']],
    },
    pay_conv:{
      cols:[[{id:'j0',lbl:'订单数据作业',sub:'数据作业',t:'job'},{id:'j1',lbl:'支付数据作业',sub:'数据作业',t:'job'}],
             [{id:'u0',lbl:'paid_orders',sub:'数据表',t:'up'},{id:'u1',lbl:'created_orders',sub:'数据表',t:'up'}],
             [curNode],
             [{id:'d0',lbl:'支付转化看板',sub:'数据看板',t:'board'},{id:'d1',lbl:'购买行为分析',sub:'分析案例',t:'case'}]],
      edges:[['j0','u0'],['j1','u1'],['u0','cur'],['u1','cur'],['cur','d0'],['cur','d1']],
    },
    arpu:{
      cols:[[{id:'j0',lbl:'支付汇总作业',sub:'数据作业',t:'job'}],
             [{id:'u0',lbl:'dw_pay',sub:'数据表',t:'up'}],
             [curNode],
             [{id:'d0',lbl:'收入分析看板',sub:'数据看板',t:'board'},{id:'d1',lbl:'用户价值分析',sub:'分析案例',t:'case'}]],
      edges:[['j0','u0'],['u0','cur'],['cur','d0'],['cur','d1']],
    },

  function buildDefaultLineage(){
    const src=(item.srcTable||'').split(',').map(t=>t.trim()).filter(Boolean);
    const jobs=src.length?src.map((t,i)=>({id:'j'+i,lbl:t+' 作业',sub:'数据作业',t:'job'})):[{id:'j0',lbl:'数据汇总作业',sub:'数据作业',t:'job'}];

  // ── 布局计算 ──
  const NW=132,NH=54,COL_GAP=182,ROW_GAP=78;

    function updatePct(){ const el=document.getElementById('lZoomPct'); if(el) el.textContent=Math.round(s*100)+'%'; }

      const rect=wrap.getBoundingClientRect();
      const mx=rect.width/2, my=rect.height/2;
      const ns=Math.min(3,Math.max(0.2, s*(dir>0?1.2:1/1.2)));
      const f=ns/s; tx=mx-f*(mx-tx); ty=my-f*(my-ty); s=ns; applyT(); updatePct();
    };
    window.lZoomReset=function(){ s=1; tx=0; ty=0; applyT(); updatePct(); };
    wrap.addEventListener('wheel',function(e){
      e.preventDefault();
      const rect=wrap.getBoundingClientRect();
      const mx=e.clientX-rect.left, my=e.clientY-rect.top;
      const factor=e.deltaY<0?1.1:0.909;
      const ns=Math.min(3,Math.max(0.2,s*factor));
      const f=ns/s; tx=mx-f*(mx-tx); ty=my-f*(my-ty); s=ns; applyT(); updatePct();
    },{passive:false});
    wrap.addEventListener('mousedown',function(e){
      if(e.button!==0) return;
      drag=true; sx=e.clientX; sy=e.clientY; stx=tx; sty=ty;
      wrap.style.cursor='grabbing'; e.preventDefault();
    });
    const onMove=function(e){ if(!drag) return; tx=stx+(e.clientX-sx); ty=sty+(e.clientY-sy); applyT(); };
    const onUp=function(){ if(drag){drag=false; wrap.style.cursor='grab';} };
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
    // 页面离开时清理监听
    const observer=new MutationObserver(function(){
      if(!document.getElementById('lCanvasWrap')){
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('main-content'),{childList:true,subtree:true});

    // ── 面板拖拽 resize ──
    function initPanelResizer(resizerId, panelId){
      const rz=document.getElementById(resizerId);
      const panel=document.getElementById(panelId);
      if(!rz||!panel) return;
      let dragging=false, startX=0, startW=0;
      rz.addEventListener('mousedown',function(e){
        dragging=true; startX=e.clientX; startW=panel.offsetWidth;
        document.body.style.cursor='col-resize';
        document.body.style.userSelect='none';
        e.preventDefault();
      });
      document.addEventListener('mousemove',function(e){
        if(!dragging) return;
        const delta=startX-e.clientX;
        const newW=Math.max(200,Math.min(560,startW+delta));
        panel.style.width=newW+'px';
      });
      document.addEventListener('mouseup',function(){
        if(dragging){ dragging=false; document.body.style.cursor=''; document.body.style.userSelect=''; }
      });
    }
    initPanelResizer('lPanelResizer','lDetailPanel');
  },60);
}

// ── 添加弹窗中分类树搜索过滤 ──
function acImportTreeFilter(kw){
  kw=(kw||'').trim().toLowerCase();
  // 显示/隐藏所有分类树节点
  const allIds=['aim-all-node'];
  // 收集所有节点 ID：遍历 tree 下的所有 aim-node-*
  document.querySelectorAll('#acImportTree [id^="aim-node-"]').forEach(el=>allIds.push(el.id));
  allIds.forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    if(!kw){el.style.display='';return;}
    // 取节点名称（第二个 span 或 flex:1 的 span）
    const nameSpan=el.querySelector('span[style*="flex:1"]')||el.children[2];
    const name=(nameSpan?nameSpan.textContent:'').toLowerCase();
    el.style.display=name.includes(kw)?'':'none';
  });
}

// ── 点击分类树节点：高亮 + 展开/折叠 + 批量勾选该分类下所有字段 ──
function acImportCatClick(catId){
  const mask=document.getElementById('acImportModalMask');
  if(!mask)return;
  mask._activeCatId=catId;
  // 高亮树节点
  document.querySelectorAll('#acImportTree .ac-tnode').forEach(el=>el.classList.remove('active'));
  const activeNodeEl=catId?document.getElementById('aim-node-'+catId):document.getElementById('aim-all-node');
  if(activeNodeEl)activeNodeEl.classList.add('active');
  // 展开父节点子级（如果是有 kids 的节点，则切换）
  if(catId){
    const kidsWrap=document.getElementById('aim-kids-'+catId);
    const caretEl=document.getElementById('aim-caret-'+catId);
    if(kidsWrap){
      const nowHidden=kidsWrap.style.display==='none';
      kidsWrap.style.display=nowHidden?'':'none';
      if(caretEl)caretEl.style.transform=nowHidden?'rotate(0deg)':'rotate(-90deg)';
    }
  }
  // 用该分类的字段更新右侧列表
  const catItems=mask._getItemsByCat(catId);
  document.getElementById('acImportTbody').innerHTML=mask._renderRows(catItems);

function acImportConfirm(){
  const checkedRows = [...document.querySelectorAll('#acImportTbody tr')].filter(r => r.querySelector('input:checked'));
  if(!checkedRows.length){ toast('请先勾选要添加的字段','warning'); return; }

  const mask = document.getElementById('acImportModalMask');
  const context = mask?._context || '';
  // 只在案例详情页（非 mt）时才真正写入数据
  const isCase = context && context !== 'mt';
  if(!isCase){ toast(`已添加 ${checkedRows.length} 个字段`); mask?.remove(); return; }

  const productName = context;
  const caseData = AC_METRICS_DATA[productName];
  const caseTree = AC_TREE_DATA[productName];
  if(!caseData || !caseTree){ toast(`已添加 ${checkedRows.length} 个字段`); mask?.remove(); return; }

  const allProjectItems = [...(getProjectWideData().metrics||[]).map(m=>({...m,_kind:'度量'})),
                           ...(getProjectWideData().dims||[]).map(d=>({...d,_kind:'维度'}))];

  // 已存在的字段名 Set
  const existingMetrics = new Set(caseData.metrics.map(m=>m.n));
  const existingDims = new Set(caseData.dims.map(d=>d.n));

  // 收集要添加的字段
  const toAdd = [];
  checkedRows.forEach(row => {
    const n = row.getAttribute('data-n');
    if(!n) return;
    const item = allProjectItems.find(x=>x.n===n);
    if(!item) return;
    toAdd.push(item);
  });

  // 递归查找分类树中是否已存在某 id
  function findNodeInCaseTree(nodes, id){
    for(const n of nodes){if(n.id===id)return n;const r=findNodeInCaseTree(n.kids||[],id);if(r)return r;}
    return null;
  }
  // 递归在全局树中查找节点
  function findNodeInGlobalTree(nodes, id){
    for(const n of nodes){if(n.id===id)return n;const r=findNodeInGlobalTree(n.kids||[],id);if(r)return r;}
    return null;
  }
  // 确保分类（及其父链）都存在于案例树中
  function ensureCatInTree(catId){
    if(!catId) return;
    if(findNodeInCaseTree(caseTree, catId)) return; // 已存在
    // 从全局树找出该分类节点
    const globalTree = getProjectWideTree();
    const srcNode = findNodeInGlobalTree(globalTree, catId);
    if(!srcNode) return;
    // 找父分类（在 globalTree 中向上查找）
    function findParentId(nodes, targetId, parentId){
      for(const n of nodes){
        if(n.id===targetId) return parentId;
        const r=findParentId(n.kids||[], targetId, n.id);
        if(r!==undefined) return r;
      }
      return undefined;
    }
    const parentId = findParentId(globalTree, catId, null);
    // 如果有父分类，先确保父分类存在
    if(parentId) ensureCatInTree(parentId);
    // 复制节点（不带子节点，避免复制整棵树）
    const newNode = {id:srcNode.id, n:srcNode.n, d:srcNode.d||'', kids:[]};
    if(parentId){
      const parentInCase = findNodeInCaseTree(caseTree, parentId);
      if(parentInCase){ if(!parentInCase.kids)parentInCase.kids=[]; parentInCase.kids.push(newNode); }
    } else {
      caseTree.push(newNode);
    }
  }

  // 添加字段 + 补充分类
  let addedCount = 0;
  toAdd.forEach(item => {
    const type = item._kind==='度量' ? 'metric' : 'dim';
    if(type==='metric' && !existingMetrics.has(item.n)){
      // 从原始数据中找完整字段定义
      const fullItem = Object.values(AC_METRICS_DATA).reduce((found,d)=>{
        return found || d.metrics.find(m=>m.n===item.n);
      }, null);
      caseData.metrics.push(fullItem||item);
      existingMetrics.add(item.n);
      // 确保对应分类存在于案例树
      const catId = getAcCatForItem(productName, item.n, 'metric') ||
                    AC_CAT_MAP_ALL[item.n] || '';
      if(catId) ensureCatInTree(catId);
      addedCount++;
    } else if(type==='dim' && !existingDims.has(item.n)){
      const fullItem = Object.values(AC_METRICS_DATA).reduce((found,d)=>{
        return found || d.dims.find(d2=>d2.n===item.n);
      }, null);
      caseData.dims.push(fullItem||item);
      existingDims.add(item.n);
      const catId = getAcCatForItem(productName, item.n, 'dim') ||
                    AC_DIM_CAT_MAP_ALL[item.n] || '';
      if(catId) ensureCatInTree(catId);
      addedCount++;
    }
  });

  mask?.remove();
  if(addedCount > 0){
    toast(`已添加 ${addedCount} 个字段并归入对应分类`);
    // 刷新案例详情页
    renderAnalysisCardDetail(productName, acActiveTreeId);
  } else {
    toast('所选字段已全部存在，无需重复添加','warning');
  }
}

function saveAcCatModal(mode, catId, context){
  const name = (document.getElementById('acCatNameInput')?.value||'').trim();
  const desc = (document.getElementById('acCatDescInput')?.value||'').trim();
  if(!name){ toast('请填写分类名称','warning'); return; }
  const treeKey = context==='mt' ? mtCurrentProduct : context;
  // ⚠️ 修复：始终使用 AC_TREE_DATA 的真实数组引用，
  //   不能用 getProjectWideTree()（它返回临时合并数组，push 不会写入源数据）。
  // P7 的新分类写入 mtCurrentProduct 的 AC_TREE_DATA。
  const treeRef = AC_TREE_DATA[treeKey];
  if(!treeRef){ toast('数据异常','error'); return; }
  if(mode==='edit' && catId){
    function findAndEdit(nodes){for(const n of nodes){if(n.id===catId){n.n=name;n.d=desc;return true;}if(findAndEdit(n.kids||[]))return true;}return false;}
    // 先在当前产品树里找；P7 还需在全局合并树里找（处理跨产品分类编辑）
    const found = findAndEdit(treeRef);
    if(!found && context==='mt'){
      for(const p of ANALYSIS_PRODUCTS){
        if(findAndEdit(AC_TREE_DATA[p.n]||[])){ break; }
      }
    }
    toast('分类已更新');
  } else if(mode==='create' && catId){
    // 新建子分类：在所有产品树中找到父节点
    function findAndAddKid(nodes){for(const n of nodes){if(n.id===catId){if(!n.kids)n.kids=[];n.kids.push({id:'cat-'+Date.now().toString(36),n:name,d:desc,kids:[]});return true;}if(findAndAddKid(n.kids||[]))return true;}return false;}
    let found = findAndAddKid(treeRef);
    if(!found && context==='mt'){
      for(const p of ANALYSIS_PRODUCTS){
        if(findAndAddKid(AC_TREE_DATA[p.n]||[])){ found=true; break; }
      }
    }
    if(!found) treeRef.push({id:'cat-'+Date.now().toString(36),n:name,d:desc,kids:[]});
    toast('子分类已创建');
  } else {
    // 新建顶级分类：直接写入真实数组
    treeRef.push({id:'cat-'+Date.now().toString(36), n:name, d:desc, kids:[]});
    toast('分类已创建');
  }
  closeAcCatModal();
  if(context==='mt') renderMetricTreePage(mtCurrentProduct, mtActiveTreeId);
  else renderAnalysisCardDetail(context, acActiveTreeId);
}

  const treeKey = context==='mt' ? mtCurrentProduct : context;
  function removeNode(nodes){const i=nodes.findIndex(x=>x.id===catId);if(i>=0){nodes.splice(i,1);return true;}for(const n of nodes){if(removeNode(n.kids||[]))return true;}return false;}
  if(context==='mt'){
    // P7：在所有产品树中查找并删除
    for(const p of ANALYSIS_PRODUCTS){ if(removeNode(AC_TREE_DATA[p.n]||[]))break; }
  } else {
    removeNode(AC_TREE_DATA[treeKey]||[]);
  }
  toast('分类已删除');
  if(context==='mt') renderMetricTreePage(mtCurrentProduct,'');
  else renderAnalysisCardDetail(context,'');

  if (!name) { alert('场景名称不能为空'); return; }
  if (!owner) { alert('负责人不能为空'); return; }

  if (mode === 'edit') {
    const idx = ANALYSIS_PRODUCTS.findIndex(p => p.n === origName);
    if (idx !== -1) {
      ANALYSIS_PRODUCTS[idx].n = name;
      ANALYSIS_PRODUCTS[idx].d = desc;
      ANALYSIS_PRODUCTS[idx].ownerN = owner;
    }
  } else {
    ANALYSIS_PRODUCTS.unshift({ n: name, d: desc, m: 0, dim: 0, tbl: 0, ownerN: owner, tags: [] });

    if (!AC_METRICS_DATA[name]) {

      AC_TREE_DATA[name] = [];

  toast(mode === 'edit' ? '保存成功' : '创建成功', 'success');

    renderAnalysisCardDetail(name, acActiveTreeId);

    // 创建完成后直接进入案例详情页

}

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.3 3.3 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.3a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
          </span>
          <div>
            <div style="font-size:14px;font-weight:600;color:#333;margin-bottom:8px">是否确定删除案例${caseName ? '「' + caseName + '」' : ''}？</div>

          </div>

      </div>
    </div>`;
  mask.addEventListener('click', () => mask.remove());
  document.body.appendChild(mask);
}
